<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Page Not Found</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #080b16; color: #eef2ff;
      font-family: Inter, system-ui, Arial, sans-serif; padding: 24px;
    }
    main {
      width: min(100%, 560px); text-align: center; padding: 44px 28px;
      border: 1px solid #27324a; border-radius: 22px;
      background: #101629;
    }
    .code { color: #70a5ff; font-size: 64px; font-weight: 800; }
    p { color: #aab5ce; line-height: 1.7; }
    a {
      display: inline-block; margin-top: 16px; padding: 12px 20px;
      border-radius: 10px; background: #4f8cff; color: white;
      text-decoration: none; font-weight: 700;
    }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>This page may have moved or the address may be incorrect.</p>
    <a href="/">Return to Email Threat Detection</a>
  </main>
</body>
</html>
